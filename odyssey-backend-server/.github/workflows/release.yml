# Test, seal and publish the backend image.
#
# WHAT THIS DOES NOT DO: deploy. Publishing an image and restarting a customer's
# ERP are different decisions, and the second one is made by a person who knows
# whether anyone is mid-shift. See ifa-deploy/deploy.ps1 for the deploy step.
#
# Images land in GitHub Container Registry as
#   ghcr.io/<owner>/odyssey-backend-server:<tag>
# tagged with the version and `latest` on a v* tag; a manual run (Actions >
# Release > Run workflow) builds the short SHA only.
#
# ONE RUN PER RELEASE - the tag's (2026-11-02). Pull requests and pushes to
# main ran too, each testing the same code and the main one building the
# images over again: three runs a release spent October's 2000 free minutes
# by the 26th. The gate before merging is the full local suite; this run
# still tests before it publishes anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# NOTE: no top-level IMAGE here. GHCR repository names must be lowercase and
# this owner is "Bilal-Seanet", so the value is folded to lower case in a step
# below - an uppercase name is rejected at push time with an unhelpful error.

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration suite talks to a real Postgres - it is testing Sequelize
    # queries and schema behaviour, which a mock cannot tell you anything about.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odyssey-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      # config/config.js reads the test database ONLY from DB_NAME_TEST, and
      # tests/setupTestDb.js refuses to run if it resolves to the same database
      # as DB_NAME. DB_NAME is deliberately left unset here.
      DB_NAME_TEST: odyssey-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # must match the Dockerfile: bytecode is
          cache: npm                # tied to the V8 that produced it
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name and version
        id: v
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.v.outputs.version }}" \
            -t "$IMAGE:${{ steps.v.outputs.version }}" .

      # The check DEPLOY-TO-CLIENT.md tells you to run by hand, enforced. The
      # builder stage compiles every first-party .js to bytecode and deletes the
      # source; if that silently stops working, this is a build that ships
      # readable source to a customer. Fail here, not at handover.
      - name: Verify the seal
        run: |
          leaked=$(docker run --rm --entrypoint sh "$IMAGE:${{ steps.v.outputs.version }}" \
            -c "find /app -name '*.js' -not -path '*/node_modules/*' | sort")
          echo "$leaked"
          if [ "$leaked" != "/app/run.js" ]; then
            echo "::error::Seal failed - the image contains readable source beyond run.js"
            exit 1
          fi

      - name: Push
        run: |
          docker push "$IMAGE:${{ steps.v.outputs.version }}"
          # `latest` is the last release - not whatever a manual run built.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "$IMAGE:${{ steps.v.outputs.version }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Summary
        run: |
          {
            echo "### Backend published"
            echo ""
            echo '```'
            echo "ODYSSEY_VERSION=${{ steps.v.outputs.version }}"
            echo '```'
            echo ""
            echo "Deploy with \`.\\deploy.ps1 -Version ${{ steps.v.outputs.version }}\` on the client server."
          } >> "$GITHUB_STEP_SUMMARY"
